name: Atualizar calendário do perfil
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build_profile.py', '.github/workflows/update-profile-art.yml']
permissions:
  contents: write
concurrency:
  group: profile-art
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/build_profile.py
      - name: Salvar calendário atualizado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json contrib-heatmap.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: atualizar contribuições [skip ci]'
            git push
          fi
