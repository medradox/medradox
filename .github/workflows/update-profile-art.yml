name: Atualizar calendário do perfil
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build_profile.py', 'scripts/build_analytics.py', '.github/workflows/update-profile-art.yml']
permissions:
  contents: write
concurrency:
  group: profile-art
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/build_profile.py
      - run: python scripts/build_analytics.py
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: medradox
          outputs: assets/snake.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#312e81,#5b21b6,#8b5cf6,#c4b5fd
      - name: Salvar calendário atualizado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json contrib-heatmap.svg assets/analytics.svg assets/languages.svg assets/snake.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: atualizar contribuições [skip ci]'
            git push
          fi
