<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180" role="img"><title>Estatísticas públicas do GitHub</title><style>text{font-family:monospace} .reveal{animation:show .5s both} @keyframes show{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}} .type-row{animation:typing .22s both} @keyframes typing{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}} @media(prefers-reduced-motion:reduce){.reveal,.type-row{animation:none}}</style><rect width="860" height="180" rx="16" fill="#0d1117"/><text x="28" y="36" font-size="16" fill="#a78bfa">GITHUB / ATIVIDADE PÚBLICA</text><text x="28" y="91" font-size="32" fill="#e9d5ff">1</text><text x="28" y="123" font-size="11" fill="#8b949e">REPOSITÓRIOS</text><text x="236" y="91" font-size="32" fill="#e9d5ff">9</text><text x="236" y="123" font-size="11" fill="#8b949e">CONTRIBUIÇÕES</text><text x="444" y="91" font-size="32" fill="#e9d5ff">0</text><text x="444" y="123" font-size="11" fill="#8b949e">SEGUIDORES</text><text x="652" y="91" font-size="32" fill="#e9d5ff">0</text><text x="652" y="123" font-size="11" fill="#8b949e">ESTRELAS</text><text x="28" y="155" font-size="11" fill="#8b949e">Contribuições no período do calendário · demais métricas atuais</text></svg>