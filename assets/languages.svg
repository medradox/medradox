<svg xmlns="http://www.w3.org/2000/svg" width="860" height="155" viewBox="0 0 860 155" role="img"><title>Linguagens nos repositórios públicos</title><style>text{font-family:monospace} .reveal{animation:show .5s both} @keyframes show{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}} .type-row{animation:typing .22s both} @keyframes typing{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}} @media(prefers-reduced-motion:reduce){.reveal,.type-row{animation:none}}</style><rect width="860" height="155" rx="16" fill="#0d1117"/><text x="28" y="34" font-size="16" fill="#a78bfa">LINGUAGENS / CÓDIGO PÚBLICO</text><text x="28" y="72" font-size="13" fill="#c9d1d9">Python · 100.0%</text><rect x="250" y="60" width="550.0" height="12" rx="6" fill="#818cf8"/><text x="28" y="125" font-size="11" fill="#8b949e">Proporção em bytes; não representa nível de domínio profissional.</text></svg>